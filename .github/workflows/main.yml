name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/eccc-producer-service/**'
      - 'src/eccc-notification-api/**'
      - 'src/eccc-observability/**'
      - '.github/workflows/main.yml'
      - 'scripts/deploy.sh'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_KEY }}
          script_stop: true
          script: bash ~/eccc-weather-alerts/scripts/deploy.sh
